<title>GiveLife Donor Hub</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">

<style>
:root {
  --green-700: #0F5F3A;
  --green-600: #1E8555;
  --green-500: #2CA36B;
  --green-100: #DFF0E7;
  --green-50: #EEF7F2;
  --gold: #C08419;
  --gold-bg: #FBEFD5;
  --red: #C93444;
  --red-bg: #FBE1E4;
  --bg: #F7F5EF;
  --surface: #FFFFFF;
  --surface-alt: #EFEDE6;
  --text: #1E1F22;
  --text-secondary: #4E525A;
  --text-tertiary: #7C808B;
  --border: #DDD9CE;
  --border-light: #ECE9DF;
  --shadow: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 6px 20px rgba(0,0,0,0.08);
  --accent-hover: rgba(30,133,85,0.08);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --green-700: #B4EACB;
    --green-600: #6ED09A;
    --green-500: #4EC084;
    --green-100: #123324;
    --green-50: #0D2318;
    --gold: #F0BC55;
    --gold-bg: #2E240F;
    --red: #F17683;
    --red-bg: #341518;
    --bg: #14161B;
    --surface: #1D2027;
    --surface-alt: #262A32;
    --text: #ECEDF0;
    --text-secondary: #ADB1BA;
    --text-tertiary: #757A85;
    --border: #333844;
    --border-light: #262A32;
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 6px 20px rgba(0,0,0,0.4);
    --accent-hover: rgba(110,208,154,0.1);
  }
}
:root[data-theme="dark"]{
  --green-700: #B4EACB; --green-600: #6ED09A; --green-500: #4EC084;
  --green-100: #123324; --green-50: #0D2318; --gold: #F0BC55;
  --gold-bg: #2E240F; --red: #F17683; --red-bg: #341518;
  --bg: #14161B; --surface: #1D2027; --surface-alt: #262A32;
  --text: #ECEDF0; --text-secondary: #ADB1BA; --text-tertiary: #757A85;
  --border: #333844; --border-light: #262A32;
  --shadow: 0 1px 3px rgba(0,0,0,0.3); --shadow-md: 0 6px 20px rgba(0,0,0,0.4);
  --accent-hover: rgba(110,208,154,0.1);
}

* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.55;
}
h1,h2,h3,h4 { font-family: 'DM Sans', system-ui, sans-serif; letter-spacing: -0.01em; }
button, input, select, textarea { font-family: inherit; }
::selection { background: var(--green-100); color: var(--green-700); }

.app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: 300px;
  min-width: 300px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.sidebar-header { padding: 22px 20px 18px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--green-600);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-header p { font-size: 13px; color: var(--text-tertiary); margin-top: 4px; }

.sidebar-section {
  padding: 14px 18px 8px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
  display: flex; align-items: center; justify-content: space-between;
}
.kbd {
  display: inline-block;
  padding: 1px 6px;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 4px;
  font-size: 10px;
  font-family: ui-monospace, monospace;
  color: var(--text-tertiary);
  background: var(--surface-alt);
}
.case-list { flex: 1; overflow-y: auto; padding: 0 10px 8px; }
.case-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14.5px;
  color: var(--text);
  transition: background 0.12s;
  position: relative;
  margin-bottom: 2px;
}
.case-item:hover { background: var(--accent-hover); }
.case-item.active { background: var(--green-100); color: var(--green-700); font-weight: 600; }
.case-item .case-badge {
  font-size: 12px;
  background: var(--surface-alt);
  color: var(--text-tertiary);
  padding: 2px 9px;
  border-radius: 12px;
  margin-left: auto;
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}
.case-item.active .case-badge { background: var(--green-600); color: #fff; }
.case-item .delete-case {
  display: none;
  background: none; border: none;
  color: var(--red); cursor: pointer;
  font-size: 18px; padding: 0 4px;
  line-height: 1;
}
.case-item:hover .delete-case { display: block; }
.case-item:hover .case-badge { display: none; }

.add-case-btn {
  display: flex; align-items: center; gap: 10px;
  margin: 6px 10px 14px;
  padding: 12px 14px;
  border: 1.5px dashed var(--border);
  border-radius: 10px;
  background: none;
  color: var(--green-600);
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  width: calc(100% - 20px);
}
.add-case-btn:hover { background: var(--green-50); border-color: var(--green-500); }

/* Stats */
.stats-bar { padding: 16px 20px; border-top: 1px solid var(--border); background: var(--surface-alt); }
.stats-bar .stat { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
.stats-bar .stat span:first-child { color: var(--text-tertiary); }
.stats-bar .stat span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.main-header {
  padding: 18px 26px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.main-header h2 { font-size: 22px; font-weight: 700; flex: 1; min-width: 200px; }
.header-actions { display: flex; gap: 8px; align-items: center; }

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface);
  color: var(--text);
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.12s;
}
.btn:hover { background: var(--surface-alt); border-color: var(--text-tertiary); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--green-600); color: #fff; border-color: var(--green-600); }
.btn-primary:hover { background: var(--green-500); border-color: var(--green-500); }
.btn-sm { padding: 6px 12px; font-size: 13px; }

/* legacy search box no longer in header - kept for compat */
.search-box { display: none; }

/* Media bar */
.media-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 26px;
  background: var(--surface-alt);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  white-space: nowrap;
}
.media-add-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border: 1.5px dashed var(--border);
  border-radius: 20px;
  background: none;
  color: var(--green-600);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.12s;
}
.media-add-chip:hover { background: var(--green-50); border-color: var(--green-500); }
.media-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 4px;
  border-radius: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.12s;
}
.media-chip:hover { border-color: var(--green-500); box-shadow: var(--shadow); transform: translateY(-1px); }
.media-chip:active { transform: translateY(0); }
.media-chip .thumb {
  width: 28px; height: 28px; border-radius: 50%;
  object-fit: cover; background: var(--surface-alt);
  flex-shrink: 0; display: block;
}
.media-chip .thumb-icon {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--green-100); color: var(--green-700);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.media-chip .cap {
  font-size: 13px; font-weight: 500;
  max-width: 140px; overflow: hidden; text-overflow: ellipsis;
}
.media-del {
  background: none; border: none; color: var(--text-tertiary);
  cursor: pointer; font-size: 15px; padding: 0 2px; opacity: 0;
  transition: opacity .12s; line-height: 1;
}
.media-chip:hover .media-del { opacity: 1; }
.media-del:hover { color: var(--red); }
.media-empty-hint { font-size: 12.5px; color: var(--text-tertiary); padding: 4px 8px; }

/* Saved message chips (live in the same media bar) */
.msg-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 8px;
  border-radius: 20px;
  background: var(--gold-bg);
  border: 1px solid var(--gold);
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.12s;
}
.msg-chip:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.msg-chip:active { transform: translateY(0); }
.msg-chip.selected { outline: 2px solid var(--gold); outline-offset: 1px; }
.msg-chip .msg-check { width: 15px; height: 15px; cursor: pointer; accent-color: var(--gold); flex-shrink: 0; margin: 0; }
.msg-chip .msg-icon {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--gold); color: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.msg-chip .cap {
  font-size: 13px; font-weight: 500; color: var(--gold);
  max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.msg-copy-selected {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border: none; border-radius: 20px;
  background: var(--green-600); color: #fff;
  font-size: 13px; font-weight: 600;
  cursor: pointer; flex-shrink: 0;
}
.msg-copy-selected:hover { background: var(--green-500); }
.bar-divider { width: 1px; align-self: stretch; background: var(--border); margin: 2px 2px; flex-shrink: 0; }

/* Add media modal */
.media-pick-zone {
  border: 2px dashed var(--border); border-radius: 10px;
  padding: 26px; text-align: center; cursor: pointer;
  transition: all 0.12s;
}
.media-pick-zone:hover { border-color: var(--green-500); background: var(--green-50); }
.pending-media-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; max-height: 320px; overflow-y: auto; }
.pending-media-item {
  display: flex; gap: 10px; align-items: center;
  padding: 8px; border: 1px solid var(--border-light); border-radius: 8px;
}
.pending-media-item .pm-thumb {
  width: 48px; height: 48px; border-radius: 8px;
  object-fit: cover; background: var(--surface-alt); flex-shrink: 0;
}
.pending-media-item input { flex: 1; padding: 8px 10px; font-size: 13px; }
.pm-remove { background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 18px; padding: 2px 6px; }
.pm-remove:hover { color: var(--red); }

/* Donor area */
.donor-area { flex: 1; overflow-y: auto; padding: 20px 26px 40px; }

/* Summary tiles */
.summary { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.tile {
  padding: 14px 20px;
  border-radius: 12px;
  font-size: 13px;
  min-width: 160px;
  flex: 1;
  border: 1px solid transparent;
}
.tile.donated { background: var(--green-100); border-color: var(--green-500); }
.tile.committed { background: var(--gold-bg); border-color: var(--gold); }
.tile.pending { background: var(--surface-alt); border-color: var(--border); }
.tile .lbl {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-tertiary); margin-bottom: 4px; font-weight: 600;
}
.tile .val {
  font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;
  font-family: 'DM Sans', sans-serif;
}
.tile.donated .val { color: var(--green-700); }
.tile.committed .val { color: var(--gold); }
.tile .sub { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

/* Icon-only button */
.btn.icon-only { padding: 10px; }

/* Filter chips */
.filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.filters .inline-search {
  flex: 1; min-width: 200px; margin-left: auto;
  padding: 8px 14px 8px 34px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 13.5px;
  background: var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 16 16' fill='none' stroke='%237C808B' stroke-width='2'><circle cx='7' cy='7' r='5'/><path d='M11 11l3 3'/></svg>") 12px center no-repeat;
  color: var(--text);
  outline: none;
  max-width: 320px;
}
.filters .inline-search:focus { border-color: var(--green-500); box-shadow: 0 0 0 3px var(--accent-hover); }
.chip {
  padding: 6px 14px;
  border-radius: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 13px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.12s;
  font-weight: 500;
}
.chip:hover { background: var(--surface-alt); }
.chip.active { background: var(--green-600); color: #fff; border-color: var(--green-600); }
.chip.vip.active { background: var(--gold); border-color: var(--gold); }

/* Donor cards (list layout — bigger targets, less struggle) */
.donor-list { display: flex; flex-direction: column; gap: 6px; }
.donor-card {
  display: grid;
  grid-template-columns: 30px 1fr 120px 120px 1fr 36px 30px;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: 10px;
  transition: border-color 0.12s, background 0.12s;
}
.donor-card:hover { border-color: var(--border); }
.donor-card.vip { background: var(--gold-bg); border-color: var(--gold); }
.donor-card.donated { border-left: 3px solid var(--green-500); }
.donor-card.committed { border-left: 3px solid var(--gold); }

.star-btn {
  background: none; border: none;
  font-size: 20px; cursor: pointer;
  opacity: 0.25; padding: 0;
  transition: opacity 0.12s, transform 0.12s;
  color: var(--text-tertiary);
}
.star-btn:hover { opacity: 0.7; transform: scale(1.15); }
.star-btn.active { opacity: 1; color: var(--gold); }

.donor-info { min-width: 0; }
.donor-name {
  font-size: 15px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer;
  transition: color 0.12s;
}
.donor-name:hover { color: var(--green-600); }
.donor-name .copy-hint {
  opacity: 0; margin-left: 6px; font-size: 11px;
  color: var(--text-tertiary); font-weight: 400;
  transition: opacity 0.12s;
}
.donor-name:hover .copy-hint { opacity: 1; }
.donor-phone {
  font-size: 12.5px; color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  font-family: ui-monospace, monospace;
  cursor: pointer;
}
.donor-phone:hover { color: var(--green-600); }

.msg-btn {
  background: var(--green-100);
  border: none;
  color: var(--green-700);
  width: 34px; height: 34px;
  border-radius: 8px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
}
.msg-btn:hover { background: var(--green-600); color: #fff; transform: scale(1.05); }
.msg-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.msg-btn:disabled:hover { transform: none; background: var(--green-100); color: var(--green-700); }
.msg-btn.sent { background: var(--green-600); color: #fff; }
.msg-btn.sent:hover { background: var(--green-500); color: #fff; }

.sent-badge {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 3px;
  padding: 1px 8px;
  border-radius: 12px;
  background: var(--green-100);
  color: var(--green-700);
  font-size: 11px; font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
}
.sent-badge:hover { border-color: var(--green-500); }
.sent-badge.off { background: transparent; color: var(--text-tertiary); border-color: var(--border); font-weight: 500; opacity: 0; transition: opacity 0.12s; }
.donor-card:hover .sent-badge.off { opacity: 1; }
@media (hover: none) { .sent-badge.off { opacity: 1; } }

.status-btn {
  padding: 7px 12px;
  border-radius: 8px;
  border: none;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  width: 100%;
  transition: all 0.12s;
  text-align: center;
}
.status-btn.pending { background: var(--surface-alt); color: var(--text-secondary); }
.status-btn.committed { background: var(--gold-bg); color: var(--gold); }
.status-btn.donated { background: var(--green-100); color: var(--green-700); }
.status-btn:hover { filter: brightness(0.95); }

.amount-input, .notes-input {
  padding: 8px 12px;
  border: 1px solid transparent;
  border-radius: 8px;
  font-size: 14px;
  background: transparent;
  color: var(--text);
  width: 100%;
  outline: none;
  transition: all 0.12s;
}
.amount-input { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.amount-input:hover, .notes-input:hover { background: var(--surface-alt); }
.amount-input:focus, .notes-input:focus {
  background: var(--surface); border-color: var(--green-500);
  box-shadow: 0 0 0 3px var(--accent-hover);
}
.amount-input::placeholder, .notes-input::placeholder { color: var(--text-tertiary); font-weight: 400; }

.remove-btn {
  background: none; border: none;
  color: var(--text-tertiary); cursor: pointer;
  font-size: 18px; padding: 4px 8px;
  border-radius: 6px;
  opacity: 0.3;
}
.donor-card:hover .remove-btn { opacity: 1; }
.remove-btn:hover { color: var(--red); background: var(--red-bg); }

/* Empty state */
.empty-state { text-align: center; padding: 80px 24px; color: var(--text-tertiary); }
.empty-state svg { margin-bottom: 16px; }
.empty-state h3 { font-size: 17px; color: var(--text-secondary); margin-bottom: 8px; }
.empty-state p { font-size: 14px; max-width: 380px; margin: 0 auto 22px; line-height: 1.6; }
.empty-hint { display: flex; gap: 14px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
.empty-hint span { font-size: 13px; display: flex; align-items: center; gap: 6px; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 16px;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal {
  background: var(--surface); border-radius: 14px;
  box-shadow: var(--shadow-md);
  width: 100%; max-width: 540px; max-height: 85vh;
  display: flex; flex-direction: column;
  animation: slideDown 0.2s ease;
}
@keyframes slideDown { from{transform:translateY(-12px);opacity:0} to{transform:translateY(0);opacity:1} }
.modal-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h3 { font-size: 17px; font-weight: 600; }
.modal-close {
  background: none; border: none;
  font-size: 22px; color: var(--text-tertiary);
  cursor: pointer; padding: 4px 10px;
  border-radius: 6px; line-height: 1;
}
.modal-close:hover { background: var(--surface-alt); }
.modal-body { padding: 20px 22px; overflow-y: auto; }
.modal-footer {
  padding: 14px 22px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}

textarea.paste-area {
  width: 100%; min-height: 160px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  background: var(--surface-alt);
  color: var(--text);
  resize: vertical; outline: none;
  line-height: 1.6;
}
textarea.paste-area:focus { border-color: var(--green-500); }
.hint { font-size: 13px; color: var(--text-tertiary); margin-top: 10px; line-height: 1.5; }

.case-input {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 15px;
  background: var(--surface);
  color: var(--text); outline: none;
}
.case-input:focus { border-color: var(--green-500); box-shadow: 0 0 0 3px var(--accent-hover); }

/* Toast */
.toast {
  position: fixed; bottom: 26px; right: 26px;
  background: var(--green-700);
  color: var(--surface);
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 14px; font-weight: 500;
  box-shadow: var(--shadow-md);
  z-index: 200;
  animation: slideUp 0.25s ease;
}
:root[data-theme="dark"] .toast, @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{color:#0D2318}}
@keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

/* Keyboard shortcut overlay */
.shortcuts-panel {
  position: fixed; bottom: 20px; left: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  box-shadow: var(--shadow-md);
  font-size: 12.5px;
  display: none;
  z-index: 50;
  max-width: 320px;
}
.shortcuts-panel.visible { display: block; }
.shortcuts-panel h4 { font-size: 12px; margin-bottom: 8px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; }
.shortcuts-panel .sc { display: flex; justify-content: space-between; padding: 3px 0; }
.shortcuts-panel .sc span:first-child { color: var(--text-secondary); }

.help-toggle {
  position: fixed; bottom: 20px; left: 20px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 36px; height: 36px; border-radius: 50%;
  cursor: pointer; font-size: 15px; font-weight: 600;
  box-shadow: var(--shadow);
  z-index: 40;
}
.help-toggle:hover { background: var(--surface-alt); }

.mobile-toggle {
  display: none;
  background: none; border: none;
  font-size: 24px; cursor: pointer;
  color: var(--text); padding: 4px;
}

@media(max-width:900px) {
  .donor-card { grid-template-columns: 28px 1fr auto; gap: 10px; }
  .donor-card > .status-btn { grid-column: 1/-1; }
  .donor-card > .amount-input { grid-column: 1/3; }
  .donor-card > .notes-input { grid-column: 1/-1; }
}
@media(max-width:768px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; min-width: 0; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }
  .sidebar.collapsed { display: none; }
  .mobile-toggle { display: block; }
  .main-header { padding: 12px 16px; }
  .media-bar { padding: 8px 16px; }
  .donor-area { padding: 14px 16px 40px; }
  .search-box { width: 100%; }
  .header-actions { width: 100%; flex-wrap: wrap; }
  .help-toggle, .shortcuts-panel { display: none !important; }
}

function loadState() {

  const el = document.getElementById('caseList');
  el.innerHTML = state.cases.map(c => {

    return `<div class="case-item ${c.id === state.activeCaseId ? 'active' : ''}" onclick="selectCase('${c.id}')">

      <button class="delete-case" onclick="event.stopPropagation();deleteCase('${c.id}')" title="Delete">&times;</button>

  }).join('');
}

function renderStats() {
  const el = document.getElementById('statsBar');
  const totalDonated = state.cases.reduce((s,c) => s + c.donors.filter(d => d.status==='donated').reduce((a,d) => a + (d.amount||0), 0), 0);
  const totalCommitted = state.cases.reduce((s,c) => s + c.donors.filter(d => d.status==='committed').reduce((a,d) => a + (d.amount||0), 0), 0);
  const totalDonors = state.cases.reduce((s,c) => s + c.donors.filter(d => d.status==='donated').length, 0);
  el.innerHTML = `
    <div class="stat"><span>Cases</span><span>${state.cases.length}</span></div>
    <div class="stat"><span>Donations received</span><span>${totalDonors}</span></div>
    <div class="stat"><span>Total raised</span><span>PKR ${totalDonated.toLocaleString()}</span></div>
    <div class="stat"><span>Pending pledges</span><span style="color:var(--gold)">PKR ${totalCommitted.toLocaleString()}</span></div>
  `;
}

function selectCase(id) {
  state.activeCaseId = id;
  saveState(); renderCases(); renderDonors();
  document.getElementById('addDonorBtn').disabled = false;
}

function deleteCase(id) {
  const c = state.cases.find(x => x.id === id);
  if (!confirm(`Delete "${c.name}" and all its donor records?`)) return;
  state.cases = state.cases.filter(x => x.id !== id);
  if (state.activeCaseId === id) state.activeCaseId = state.cases[0]?.id || null;
  saveState(); renderCases(); renderDonors(); renderStats();
}

function getFilteredDonors(c) {
  const filter = (state.searchTerm || '').toLowerCase();
  let donors = c.donors.map((d, i) => ({ ...d, _idx: i }));
  if (filter) {
    donors = donors.filter(d =>
      (d.name || '').toLowerCase().includes(filter) ||
      (d.phone || '').includes(filter) ||
      (d.notes || '').toLowerCase().includes(filter)
    );
  }
  if (state.filter === 'donated') donors = donors.filter(d => d.status === 'donated');
  else if (state.filter === 'committed') donors = donors.filter(d => d.status === 'committed');
  else if (state.filter === 'pending') donors = donors.filter(d => d.status === 'pending' || !d.status);
  else if (state.filter === 'vip') donors = donors.filter(d => d.vip);
  else if (state.filter === 'sent') donors = donors.filter(d => d.sent);
  else if (state.filter === 'notsent') donors = donors.filter(d => !d.sent);
  return donors;
}

      <div class="chip ${state.filter==='sent'?'active':''}" onclick="setFilter('sent')">✓ Sent (${nSent})</div>
      <div class="chip ${state.filter==='notsent'?'active':''}" onclick="setFilter('notsent')">Not sent (${c.donors.length - nSent})</div>

function renderCard(d) {
  const status = d.status || 'pending';

    <button class="star-btn ${d.vip?'active':''}" onclick="toggleVip(${d._idx})" title="Mark important">&#9733;</button>
    <div class="donor-info">
      <div class="donor-name" onclick="copyDonor(${d._idx})" title="Click to copy phone number">
        ${d.name ? esc(d.name) : '<span style="color:var(--text-tertiary);font-style:italic">Unnamed</span>'}
        <span class="copy-hint">${hasPhone ? '⧉ copy' : ''}</span>
      </div>
      ${d.phone ? `<div class="donor-phone" onclick="copyPhone('${d.phone}')" title="Click to copy">${esc(d.phone)}</div>` : ''}
      ${d.sent
        ? `<div class="sent-badge" onclick="toggleSent(${d._idx})" title="Messaged — click to unmark">✓ Sent</div>`
        : `<div class="sent-badge off" onclick="toggleSent(${d._idx})" title="Mark as sent without opening WhatsApp">Mark sent</div>`}
    </div>
    <button class="status-btn ${status}" onclick="cycleStatus(${d._idx})" title="Click to cycle status">${statusLabel}</button>
    <input class="amount-input" type="number" value="${d.amount||''}" placeholder="PKR 0" onchange="setAmount(${d._idx}, this.value)">
    <input class="notes-input" type="text" value="${esc(d.notes||'')}" placeholder="Notes..." onchange="setNotes(${d._idx}, this.value)">
    <button class="msg-btn ${d.sent ? 'sent' : ''}" onclick="sendMessage(${d._idx})" title="${d.sent ? 'Already messaged — click to message again' : (hasPhone ? 'Open WhatsApp with message' : 'Copy personalized message')}">

    <button class="remove-btn" onclick="removeDonor(${d._idx})" title="Remove">&times;</button>
  </div>`;
}

function cycleStatus(idx) {
  const c = getActiveCase(); if(!c) return;
  const order = ['pending', 'committed', 'donated'];
  const cur = c.donors[idx].status || 'pending';
  c.donors[idx].status = order[(order.indexOf(cur) + 1) % order.length];
  saveState(); renderDonors();
}
function toggleVip(idx) {
  const c = getActiveCase(); if(!c) return;
  c.donors[idx].vip = !c.donors[idx].vip;
  saveState(); renderDonors();
}
function setAmount(idx, val) {
  const c = getActiveCase(); if(!c) return;
  c.donors[idx].amount = parseInt(val) || 0;
  saveState(); renderDonors();
}
function setNotes(idx, val) {
  const c = getActiveCase(); if(!c) return;
  c.donors[idx].notes = val;
  saveState();
}
function removeDonor(idx) {
  const c = getActiveCase(); if(!c) return;
  c.donors.splice(idx, 1);
  saveState(); renderDonors();
}
function copyPhone(p) {
  navigator.clipboard.writeText(p).then(() => toast('Phone copied: ' + p));
}

function copyDonor(idx) {
  const c = getActiveCase(); if(!c) return;
  const d = c.donors[idx];
  if (d.phone) {
    navigator.clipboard.writeText(d.phone).then(() => toast('Copied: ' + (d.name || d.phone)));
  } else {
    navigator.clipboard.writeText(d.name).then(() => toast('Name copied (no phone available)'));
  }
}

function getFirstName(name) {
  if (!name) return 'Brother';
  return name.split(/\s+/)[0].replace(/[^\w]/g, '');
}

function buildMessage(donor) {
  const first = getFirstName(donor.name);
  return (state.messageTemplate || DEFAULT_TEMPLATE).replace(/\{name\}/g, first);
}

function sendMessage(idx) {
  const c = getActiveCase(); if(!c) return;
  const d = c.donors[idx];
  const message = buildMessage(d);
  if (d.phone) {
    const phoneClean = d.phone.replace(/[^\d]/g, '');
    const url = `https://wa.me/${phoneClean}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
    toast('Opening WhatsApp for ' + (d.name || d.phone) + ' — marked as sent');
  } else {
    navigator.clipboard.writeText(message).then(() => toast('Message copied — marked as sent'));
  }
  d.sent = true;
  d.sentAt = Date.now();
  saveState(); renderDonors();
}

function toggleSent(idx) {
  const c = getActiveCase(); if(!c) return;
  const d = c.donors[idx];
  d.sent = !d.sent;
  d.sentAt = d.sent ? Date.now() : null;
  saveState(); renderDonors();
  toast(d.sent ? 'Marked as sent' : 'Unmarked');
}

function onSearchInput(v) {
  state.searchTerm = v;
  saveState();
  // Only re-render list section (not the input, to keep focus)
  const c = getActiveCase(); if (!c) return;
  const donors = getFilteredDonors(c);

  const listEl = document.querySelector('.donor-list');
  if (listEl) {
    listEl.innerHTML = donors.map(d => renderCard(d)).join('');
  } else {
    renderDonors();
  }
}

function extractEntries(text) {
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const entries = [];
  for (let line of lines) {
    const phoneMatch = line.match(/\+?\d[\d\s\-()]{6,}\d/);
    const phone = phoneMatch ? phoneMatch[0].replace(/[\s\-()]/g, '') : '';
    let name = line
      .replace(/\+?\d[\d\s\-()]{6,}\d/g, '')
      .replace(/\|/g, '')
      .replace(/^\d+[\.\)\-\s]+/, '')
      .replace(/\b(Donor|Donir|Donoe|Donkr|Member|Group admin|no number shown)\b/gi, '')
      .replace(/[~♦️❤💞😎]/g, '')
      .replace(/\(.*?\)/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    if (name || phone) entries.push({ name, phone });
  }
  return entries;
}

function addPastedDonors() {
  const c = getActiveCase(); if(!c) return;
  const text = document.getElementById('pasteArea').value;
  const entries = extractEntries(text);
  let added = 0;
  for (const e of entries) {
    const dup = c.donors.some(d =>
      (e.phone && d.phone === e.phone) ||
      (e.name && d.name === e.name && !e.phone && !d.phone)
    );
    if (!dup) {
      c.donors.push({ name: e.name, phone: e.phone, status: 'pending', amount: 0, vip: false, notes: '' });
      added++;
    }
  }
  saveState(); closeModal(); renderDonors();
  toast(`${added} donor${added !== 1 ? 's' : ''} added`);
}

async function exportCase() {
  const c = getActiveCase();
  if (!c) { toast('Select a case first'); return; }
  let csv = 'Name,Phone,Status,Amount (PKR),VIP,Message Sent,Notes\n';
  for (const d of c.donors) {
    csv += `"${(d.name||'').replace(/"/g,'""')}","${d.phone||''}",${d.status||'pending'},${d.amount||0},${d.vip?'Yes':'No'},${d.sent?'Yes':'No'},"${(d.notes||'').replace(/"/g,'""')}"\n`;
  }
  const filename = c.name.replace(/[^a-z0-9]/gi,'_') + '_donors.csv';

  try {
    const downloads = window.claude ? await window.claude.use("downloads") : null;
    if (downloads) {
      await downloads.save({ filename, data: csv });
      toast('Exported'); return;
    }
  } catch(e) { if (e.code === 'declined') return; }

  // Fallback: standalone browser download
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Exported');
}

// ============ MEDIA LIBRARY (photos & videos, stored in IndexedDB) ============
let mediaItems = [];
let pendingMediaFiles = [];
let mediaDBAvailable = true;

function openMediaDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('no indexedDB')); return; }
    const req = indexedDB.open('givelife_media_db', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('media')) db.createObjectStore('media', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function mediaDBAdd(item) {
  const db = await openMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', 'readwrite');
    tx.objectStore('media').put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function mediaDBGetAll() {
  const db = await openMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', 'readonly');
    const req = tx.objectStore('media').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function mediaDBDelete(id) {
  const db = await openMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', 'readwrite');
    tx.objectStore('media').delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function loadMediaLibrary() {
  try {
    const items = await mediaDBGetAll();
    mediaItems = items.map(it => ({ ...it, url: URL.createObjectURL(it.blob) }));
    mediaItems.sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    mediaDBAvailable = true;
  } catch(e) {
    mediaItems = [];
    mediaDBAvailable = false;
  }
  renderMediaBar();
}

function saveMessageItem(editId) {
  const label = document.getElementById('msgLabel').value.trim();
  const text = document.getElementById('msgText').value.trim();
  if (!text) { toast('Message text is empty'); return; }
  if (editId) {
    const m = state.savedMessages.find(x => x.id === editId);
    if (m) { m.label = label; m.text = text; }
  } else {
    state.savedMessages.push({ id: uid(), label, text });
  }
  saveState(); closeModal(); renderMediaBar();
  toast(editId ? 'Message updated' : 'Message saved');
}

function copySavedMessage(id) {
  const m = state.savedMessages.find(x => x.id === id);
  if (!m) return;
  navigator.clipboard.writeText(m.text).then(
    () => toast('Copied: ' + (m.label || m.text.slice(0, 30))),
    () => toast('Copy failed')
  );
}

function deleteSavedMessage(id) {
  if (!confirm('Remove this saved message?')) return;
  state.savedMessages = state.savedMessages.filter(x => x.id !== id);
  selectedMsgIds.delete(id);
  saveState(); renderMediaBar();
  toast('Removed');
}

function toggleMsgSelect(id, checked) {
  if (checked) selectedMsgIds.add(id); else selectedMsgIds.delete(id);
  renderMediaBar();
}

function copySelectedMessages() {
  // Copy in the order they appear in the bar, joined by a blank line
  const texts = state.savedMessages.filter(m => selectedMsgIds.has(m.id)).map(m => m.text);
  if (texts.length === 0) return;
  const combined = texts.join('\n\n');
  navigator.clipboard.writeText(combined).then(
    () => toast(`Copied ${texts.length} messages`),
    () => toast('Copy failed')
  );
}

function handleMediaFiles(fileList) {
  const files = Array.from(fileList);
  for (const file of files) {
    const type = file.type.startsWith('video') ? 'video' : 'image';
    const previewUrl = URL.createObjectURL(file);
    pendingMediaFiles.push({ file, caption: file.name.replace(/\.[^.]+$/, ''), previewUrl, type });
  }
  renderPendingMedia();
}

function renderPendingMedia() {
  const list = document.getElementById('pendingMediaList');
  list.innerHTML = pendingMediaFiles.map((p, i) => `
    <div class="pending-media-item">
      ${p.type === 'image' ? `<img class="pm-thumb" src="${p.previewUrl}">` : `<video class="pm-thumb" src="${p.previewUrl}" muted></video>`}
      <input class="case-input" value="${esc(p.caption)}" placeholder="Caption / name" oninput="pendingMediaFiles[${i}].caption=this.value">
      <button class="pm-remove" onclick="removePendingMedia(${i})" title="Remove">&times;</button>
    </div>
  `).join('');
  document.getElementById('saveMediaBtn').disabled = pendingMediaFiles.length === 0;
}

function removePendingMedia(i) {
  URL.revokeObjectURL(pendingMediaFiles[i].previewUrl);
  pendingMediaFiles.splice(i, 1);
  renderPendingMedia();
}

async function saveMediaFiles() {
  if (pendingMediaFiles.length === 0) return;
  for (const p of pendingMediaFiles) {
    const item = {
      id: uid(),
      name: p.caption.trim() || p.file.name,
      type: p.type,
      mime: p.file.type,
      blob: p.file,
      createdAt: Date.now()
    };
    try { await mediaDBAdd(item); } catch(e) { toast('Could not save ' + item.name); }
  }
  const count = pendingMediaFiles.length;
  pendingMediaFiles = [];
  closeModal();
  await loadMediaLibrary();
  toast(`${count} file${count!==1?'s':''} added to Media Library`);
}

async function deleteMediaItem(id) {
  if (!confirm('Remove this from the media library?')) return;
  try { await mediaDBDelete(id); } catch(e) {}
  const item = mediaItems.find(m => m.id === id);
  if (item) URL.revokeObjectURL(item.url);
  await loadMediaLibrary();
  toast('Removed');
}

function mediaFilename(m) {
  const ext = (m.mime && m.mime.split('/')[1]) || (m.type === 'video' ? 'mp4' : 'png');
  const base = (m.name || 'media').replace(/[^a-z0-9]/gi, '_');
  return `${base}.${ext}`;
}

function convertBlobToPng(blob) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      canvas.toBlob(b => {
        URL.revokeObjectURL(url);
        if (b) resolve(b); else reject(new Error('conversion failed'));
      }, 'image/png');
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function copyImageBlobToClipboard(blob) {
  try {
    await navigator.clipboard.write([new ClipboardItem({ [blob.type || 'image/png']: blob })]);
    return true;
  } catch(e) {
    try {
      const pngBlob = await convertBlobToPng(blob);
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
      return true;
    } catch(e2) { return false; }
  }
}

async function fallbackDownload(blob, filename) {
  try {
    const downloads = window.claude ? await window.claude.use("downloads") : null;
    if (downloads) { await downloads.save({ filename, data: blob }); return; }
  } catch(e) {}
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function copyMediaItem(id) {
  const m = mediaItems.find(x => x.id === id);
  if (!m) return;
  if (m.type === 'image') {
    const ok = await copyImageBlobToClipboard(m.blob);
    if (ok) { toast('Image copied — paste it into WhatsApp'); return; }
    await fallbackDownload(m.blob, mediaFilename(m));
    toast("Clipboard copy isn't supported here — downloaded instead");
  } else {
    let ok = false;
    try {
      await navigator.clipboard.write([new ClipboardItem({ [m.mime || 'video/mp4']: m.blob })]);
      ok = true;
    } catch(e) { ok = false; }
    if (ok) { toast('Video copied — paste it into WhatsApp'); return; }
    await fallbackDownload(m.blob, mediaFilename(m));
    toast("Browsers can't copy video to clipboard — downloaded instead, attach it in WhatsApp");
  }
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector('.modal-overlay') && e.key !== 'Escape') return;

  switch(e.key.toLowerCase()) {
    case 'n': e.preventDefault(); showNewCaseModal(); break;
    case 'a': if (getActiveCase()) { e.preventDefault(); showAddDonorModal(); } break;
    case 'm': e.preventDefault(); showMessageTemplateModal(); break;
    case 'p': e.preventDefault(); showAddMediaModal(); break;
    case '/': e.preventDefault(); document.getElementById('searchBox')?.focus(); break;
    case 'escape': closeModal(); document.getElementById('shortcutsPanel').classList.remove('visible'); break;
    case '?': toggleShortcuts(); break;
    case 't': toggleTheme(); break;
    case '1': setFilter('all'); break;
    case '2': setFilter('donated'); break;
    case '3': setFilter('committed'); break;
    case '4': setFilter('pending'); break;
    case '5': setFilter('sent'); break;
    case '6': setFilter('notsent'); break;
    case 'j': case 'k': {
      const i = state.cases.findIndex(c => c.id === state.activeCaseId);
      const n = e.key === 'j' ? i + 1 : i - 1;
      if (state.cases[n]) selectCase(state.cases[n].id);
      break;
    }
  }
});

// Init
loadState();
renderCases();
renderDonors();
renderStats();
updateThemeIcon();
loadMediaLibrary();
if (state.activeCaseId) document.getElementById('addDonorBtn').disabled = false;
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeIcon);
</script>
