<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe4ee"/>
      <stop offset="1" stop-color="#f7b8cf"/>
    </radialGradient>
    <radialGradient id="fur" cx="45%" cy="38%" r="65%">
      <stop offset="0" stop-color="#d9a273"/>
      <stop offset="1" stop-color="#a86a3f"/>
    </radialGradient>
    <radialGradient id="snout" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fbe6cf"/>
      <stop offset="1" stop-color="#ecc9a4"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="60" fill="url(#bg)"/>
  <!-- ears -->
  <circle cx="30" cy="36" r="17" fill="url(#fur)"/>
  <circle cx="90" cy="36" r="17" fill="url(#fur)"/>
  <circle cx="30" cy="37" r="9" fill="#f3b9a6"/>
  <circle cx="90" cy="37" r="9" fill="#f3b9a6"/>
  <!-- head -->
  <ellipse cx="60" cy="66" rx="38" ry="35" fill="url(#fur)"/>
  <!-- snout -->
  <ellipse cx="60" cy="80" rx="17" ry="13" fill="url(#snout)"/>
  <!-- eyes -->
  <ellipse cx="46" cy="62" rx="5.2" ry="6.2" fill="#2b1a12"/>
  <ellipse cx="74" cy="62" rx="5.2" ry="6.2" fill="#2b1a12"/>
  <circle cx="47.8" cy="59.6" r="1.9" fill="#fff"/>
  <circle cx="75.8" cy="59.6" r="1.9" fill="#fff"/>
  <!-- cheeks -->
  <ellipse cx="36" cy="75" rx="6.5" ry="4" fill="#ff8fb1" opacity=".55"/>
  <ellipse cx="84" cy="75" rx="6.5" ry="4" fill="#ff8fb1" opacity=".55"/>
  <!-- nose and smile -->
  <ellipse cx="60" cy="75" rx="5.5" ry="4" fill="#3a2418"/>
  <ellipse cx="58.6" cy="73.8" rx="1.6" ry="1" fill="#fff" opacity=".7"/>
  <path d="M60 79 v3.5 M60 82.5 q-5 4.5 -9 1 M60 82.5 q5 4.5 9 1" stroke="#3a2418" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- bow -->
  <g transform="translate(92 26) rotate(18)">
    <path d="M0 0 C-14 -10 -16 8 0 2 Z" fill="#ff5c93"/>
    <path d="M0 0 C14 -10 16 8 0 2 Z" fill="#ff5c93"/>
    <path d="M-2 2 L-7 12 L-1 9 Z M2 2 L7 12 L1 9 Z" fill="#e84a80"/>
    <circle cx="0" cy="1" r="3.4" fill="#ff8fb1"/>
  </g>
</svg>
